name: grotto

services:
  postgres:
    image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: grotto-postgres
    environment:
      POSTGRES_DB: grotto_production
      POSTGRES_PASSWORD: ${GROTTO_POSTGRES_ADMIN_PASSWORD:?GROTTO_POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_USER: grotto_admin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "127.0.0.1:5438:5432"
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 60s
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    name: grotto_postgres_data
