<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta content="width=device-width, initial-scale=1" name="viewport">
        <meta
            content="Grotto is a local-first workspace for persistent AI agents, tools, skills, and conversations."
            name="description"
        >
        <meta content="#f8f7f4" name="theme-color">
        <link href="/favicon.svg" rel="icon" type="image/svg+xml">
        <title>Grotto</title>
        <style>
        :root {
            font-family:
                Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                sans-serif;
            color: #181817;
            color-scheme: light dark;
            background: #f8f7f4;
        }

        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
        }

        main {
            width: min(34rem, calc(100% - 3rem));
        }

        .mark {
            display: grid;
            place-items: center;
            width: 3rem;
            height: 3rem;
            font-size: 1.25rem;
            background: #fff;
            border: 1px solid #d9d7d1;
            border-radius: 1rem;
            box-shadow: 0 0.25rem 1rem rgb(24 24 23 / 8%);
        }

        h1 {
            margin: 1.5rem 0 0.5rem;
            font-size: clamp(2.4rem, 7vw, 4.25rem);
            line-height: 0.95;
            letter-spacing: -0.06em;
        }

        p {
            max-width: 30rem;
            margin: 0;
            font-size: 1.05rem;
            line-height: 1.55;
            color: #66645f;
        }

        nav {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        a {
            font-size: 0.9rem;
            color: inherit;
            text-underline-offset: 0.2rem;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                color: #f3f2ee;
                background: #151514;
            }

            .mark {
                background: #201f1d;
                border-color: #3a3936;
                box-shadow: 0 0.25rem 1rem rgb(0 0 0 / 25%);
            }

            p {
                color: #aaa7a0;
            }
        }
        </style>
    </head>
    <body>
        <main>
            <div aria-hidden="true" class="mark">⌁</div>
            <h1>Grotto</h1>
            <p>
                A local-first workspace for persistent AI agents, their tools, skills, and shared
                conversations.
            </p>
            <nav aria-label="Product information">
                <a href="/privacy">Privacy</a>
                <a href="mailto:support@grotto.sh">Support</a>
            </nav>
        </main>
    </body>
</html>
