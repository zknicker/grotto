name: Grotto

options:
  bundleIdPrefix: build.grotto
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"

packages:
  GrottoIOS:
    path: .
  ClerkKit:
    url: https://github.com/clerk/clerk-ios
    exactVersion: 1.2.0

targets:
  Grotto:
    type: application
    platform: iOS
    sources:
      - path: Sources/GrottoApp
      - path: ../../assets/mac-icon.icon
        buildPhase: resources
        # The shared icon lives above this directory. Intermediate groups would
        # climb past the project root and synthesize a navigator group named
        # after the checkout directory, so XcodeGen's name-derived reference IDs
        # would change per worktree and churn the checked-in project.
        createIntermediateGroups: false
    dependencies:
      - package: GrottoIOS
        product: GrottoModels
      - package: GrottoIOS
        product: GrottoTransport
      - package: GrottoIOS
        product: GrottoUI
      - package: ClerkKit
        product: ClerkKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: build.grotto.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: mac-icon
        # Local/dev default only. A real TestFlight upload always overrides both
        # via explicit xcodebuild args from `bun run ios:release`; see
        # docs/operations/ios-testflight.md. Both values mirror the latest
        # published iOS target in releases.json via release:sync-versions.
        CURRENT_PROJECT_VERSION: "13"
        MARKETING_VERSION: 1.2.3
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Grotto
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - grotto
              - build.grotto.ios
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Take photos to attach to Grotto messages.
        NSPhotoLibraryUsageDescription: Choose photos to attach to Grotto messages.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: Config/Grotto.entitlements
      properties:
        com.apple.developer.associated-domains:
          - webcredentials:clerk.grotto.sh

schemes:
  Grotto:
    build:
      targets:
        Grotto: all
    run:
      config: Debug
    test:
      config: Debug
