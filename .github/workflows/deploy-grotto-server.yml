name: Deploy Grotto Server

# Manual only. Publishing a GitHub Release no longer deploys: a deploy is an
# explicit act now that it resolves production credentials from 1Password and
# renders the Server's delivered environment from the committed .env.schema.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published Grotto version (vX.Y.Z)
        required: true
        type: string
      mode:
        description: Production action
        required: true
        type: choice
        options:
          - deploy
          - activate

concurrency:
  group: grotto-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy published Grotto version
    runs-on: [self-hosted, grotto]
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GROTTO_DEPLOY_ROOT: /Users/zknicker/srv/grotto
      PATH: /opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - name: Resolve published version
        working-directory: /Users/zknicker/srv/grotto
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "${REQUESTED_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be an exact vX.Y.Z release tag" >&2
            exit 1
          fi
          if [[ "${REQUESTED_MODE}" != "deploy" && "${REQUESTED_MODE}" != "activate" ]]; then
            echo "mode must be deploy or activate" >&2
            exit 1
          fi

          release_state="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${REQUESTED_VERSION}" \
              --jq '[.tag_name, .draft, .prerelease, .published_at] | @tsv'
          )"
          IFS=$'\t' read -r published_tag draft prerelease published_at <<<"${release_state}"
          if [[ "${published_tag}" != "${REQUESTED_VERSION}" || "${draft}" != "false" || "${prerelease}" != "false" || -z "${published_at}" || "${published_at}" == "null" ]]; then
            echo "version must name a published, non-prerelease GitHub Release" >&2
            exit 1
          fi

          tag_ref_state="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${REQUESTED_VERSION}" \
              --jq '[.object.type, .object.sha] | @tsv'
          )"
          IFS=$'\t' read -r tag_ref_type tag_object_sha <<<"${tag_ref_state}"
          if [[ "${tag_ref_type}" != "tag" || ! "${tag_object_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release tag must be annotated" >&2
            exit 1
          fi

          tag_state="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" \
              --jq '[.tag, .object.type, .object.sha] | @tsv'
          )"
          IFS=$'\t' read -r annotated_tag target_type revision <<<"${tag_state}"
          if [[ "${annotated_tag}" != "${REQUESTED_VERSION}" || "${target_type}" != "commit" || ! "${revision}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release tag did not resolve to a full commit" >&2
            exit 1
          fi

          {
            echo "GROTTO_RELEASE_MODE=${REQUESTED_MODE}"
            echo "GROTTO_RELEASE_VERSION=${REQUESTED_VERSION}"
            echo "GROTTO_SOURCE_REVISION=${revision}"
          } >>"${GITHUB_ENV}"

      # The environment contract travels with the release, not with `main`: the
      # workspace is checked out at the exact revision the published artifact
      # was built from, so `.env.schema` and the render script always match the
      # Server about to run.
      - name: Check out the released revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GROTTO_SOURCE_REVISION }}
          persist-credentials: false

      - name: Refuse a stray environment file
        run: |
          set -euo pipefail
          # Varlock loads a checkout .env above .env.schema, and a `$` in any of
          # its values is parsed as an expression — that combination took a
          # sibling service down. Neither the workspace nor the deploy root may
          # hold one.
          for candidate in "${GITHUB_WORKSPACE}/.env" "${GROTTO_DEPLOY_ROOT}/.env"; do
            if [[ -e "${candidate}" ]]; then
              echo "${candidate} exists; the schema is the only source of production values." >&2
              exit 1
            fi
          done

      - name: Ensure private PostgreSQL
        run: |
          set -euo pipefail
          docker volume inspect grotto_postgres_data >/dev/null
          if [[ "$(docker inspect --format '{{.State.Health.Status}}' grotto-postgres 2>/dev/null || true)" == "healthy" ]]; then
            echo "grotto-postgres is healthy; leaving the running container untouched."
          else
            # The admin password is interpolated by Compose from the value
            # varlock resolved. No environment file is read or written.
            bunx varlock@1.16.1 run -- \
              docker compose -f apps/server/compose.yml -p grotto up -d --wait
          fi
        env:
          VARLOCK_ENV: production
          DEPLOY_AGENT_PRODUCTION_OP_TOKEN: ${{ secrets.GH_DEPLOY_AGENT_PRODUCTION_OP_TOKEN }}

      - name: Deploy downloaded release
        if: env.GROTTO_RELEASE_MODE == 'deploy'
        run: |
          set -euo pipefail
          deploy_temp="$(/usr/bin/mktemp -d "${RUNNER_TEMP}/grotto-server-deploy.XXXXXX")"
          cleanup() {
            /usr/bin/trash "${deploy_temp}"
          }
          trap 'cleanup' EXIT

          product_version="${GROTTO_RELEASE_VERSION#v}"
          release_id="${product_version}+git.${GROTTO_SOURCE_REVISION:0:12}"
          archive_name="grotto-server-${release_id}-aarch64-apple-darwin.tar.gz"
          archive_asset_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GROTTO_RELEASE_VERSION}" \
              --jq ".assets[] | select(.name == \"${archive_name}\") | .id"
          )"
          checksum_asset_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GROTTO_RELEASE_VERSION}" \
              --jq ".assets[] | select(.name == \"${archive_name}.sha256\") | .id"
          )"
          if [[ ! "${archive_asset_id}" =~ ^[0-9]+$ || ! "${checksum_asset_id}" =~ ^[0-9]+$ ]]; then
            echo "published release must contain the exact Grotto Server archive and checksum" >&2
            exit 1
          fi

          archive_path="${deploy_temp}/${archive_name}"
          checksum_path="${archive_path}.sha256"
          gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${archive_asset_id}" \
            --header "Accept: application/octet-stream" >"${archive_path}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${checksum_asset_id}" \
            --header "Accept: application/octet-stream" >"${checksum_path}"
          (
            cd "${deploy_temp}"
            /usr/bin/shasum -a 256 -c "${archive_name}.sha256"
          )

          /bin/mkdir "${deploy_temp}/operation"
          /usr/bin/tar -xzf "${archive_path}" \
            -C "${deploy_temp}/operation" \
            ./bin/grotto-server-deploy
          test -f "${deploy_temp}/operation/bin/grotto-server-deploy"
          test ! -L "${deploy_temp}/operation/bin/grotto-server-deploy"
          test -x "${deploy_temp}/operation/bin/grotto-server-deploy"
          "${deploy_temp}/operation/bin/grotto-server-deploy" \
            install \
            "${archive_path}" \
            "${GROTTO_RELEASE_VERSION}" \
            "${GROTTO_SOURCE_REVISION}"

      - name: Verify installed release
        if: env.GROTTO_RELEASE_MODE == 'activate'
        run: |
          test -d "${GROTTO_DEPLOY_ROOT}/releases/${GROTTO_SOURCE_REVISION}"

      # The delivered runtime copy. Rendered from .env.schema every deploy, so
      # a renamed or removed value can never survive in production, and mode
      # 0600 plus one ACL entry gives _grotto_server exactly the read it needs
      # without any privileged helper.
      - name: Render the Server environment
        env:
          VARLOCK_ENV: production
          DEPLOY_AGENT_PRODUCTION_OP_TOKEN: ${{ secrets.GH_DEPLOY_AGENT_PRODUCTION_OP_TOKEN }}
        run: |
          set -euo pipefail
          bunx varlock@1.16.1 run -- bun scripts/render-server-env.ts

      - name: Apply database migrations
        env:
          VARLOCK_ENV: production
          DEPLOY_AGENT_PRODUCTION_OP_TOKEN: ${{ secrets.GH_DEPLOY_AGENT_PRODUCTION_OP_TOKEN }}
        run: |
          set -euo pipefail
          migration_binary="${GROTTO_DEPLOY_ROOT}/releases/${GROTTO_SOURCE_REVISION}/bin/grotto-server-migrate"
          migration_result=""
          if migration_result="$(bunx varlock@1.16.1 run -- "${migration_binary}")"; then
            echo "Database: ✅ ${migration_result}"
            {
              echo "### Database"
              echo
              echo "- ✅ ${migration_result}"
            } >>"${GITHUB_STEP_SUMMARY}"
          else
            {
              echo "### Database"
              echo
              echo "- ❌ Migration failed; release was not activated."
            } >>"${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

      - name: Activate migrated release
        run: |
          /usr/bin/sudo -n /usr/local/libexec/grotto/activate-grotto-server \
            "${GROTTO_SOURCE_REVISION}"

      - name: Prove local Server health
        run: |
          set -euo pipefail
          response="$(
            /usr/bin/curl --fail --silent --show-error --max-time 8 \
              http://127.0.0.1:18791/healthz
          )"
          health_status="$(
            /usr/bin/python3 -c 'import json, sys; print(json.load(sys.stdin)["status"])' \
              <<<"${response}"
          )"
          test "${health_status}" = "ok"

      # Names only: a delivered name the schema no longer declares is stale, and
      # a production-required secret missing from delivery is a failure.
      - name: Verify the delivered environment
        run: bun scripts/verify-deployed-secrets.ts
